<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="alibi — your agent says Done. All tests pass.">
  <rect width="1280" height="640" fill="#0d1117"/>
  <rect x="0" y="0" width="1280" height="6" fill="#f85149"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="88" y="150" font-size="72" font-weight="700" fill="#e6edf3">alibi</text>

    <text x="88" y="248" font-size="36" fill="#e6edf3">Your agent says &#8220;Done. All tests pass.&#8221;</text>

    <text x="88" y="322" font-size="27" fill="#7d8590">It reverts the fix, runs the new test again,</text>
    <text x="88" y="362" font-size="27" fill="#7d8590">and shows you the ones that still pass.</text>

    <g font-size="25">
      <text x="88" y="452" fill="#f85149">&#10007;</text>
      <text x="128" y="452" fill="#e6edf3">returns a list</text>
      <text x="400" y="452" fill="#f85149">NO ALIBI</text>
      <text x="128" y="490" fill="#7d8590">passes on the code from before the fix</text>
    </g>

    <text x="88" y="576" font-size="22" fill="#7d8590">No model. No network. Any test runner.</text>
    <text x="1192" y="576" font-size="22" fill="#7d8590" text-anchor="end">github.com/BOTIROFF-D/alibi</text>
  </g>
</svg>
